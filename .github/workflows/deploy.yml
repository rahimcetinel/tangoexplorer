name: Deploy

# Hızlı yol: main'i build edip Cloudflare Pages'e basar. İçerik toplama işi
# "Update site" (update.yml) hattında; kod değişikliğini yayına almak için
# onu elle tetiklemeye gerek yok.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# update.yml ile aynı grup: iki hat aynı commit'i aynı anda build edip
# deploy etmesin. Sıraya girerler, birbirini iptal etmezler.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Astro optimize görselleri node_modules/.astro içinde tutar; `npm ci`
      # bu dizini siler. Kurulumdan sonra geri yüklemek, içerik değişmediği
      # koşularda ~4.6k sharp dönüşümünü tekrar yapmayı önler.
      - name: Restore Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-images-${{ runner.os }}-

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name tango-news --commit-dirty=true
