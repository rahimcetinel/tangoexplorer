name: Update site

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: agentic-python/out
          key: ingest-out-${{ github.run_id }}
          restore-keys: |
            ingest-out-

      - run: npm ci

      - name: Ingest and publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          python agentic-python/ingest.py || true
          python agentic-python/publish.py || true
          python agentic-python/ingest_hoy.py || true
          python agentic-python/ingest_tangoverse.py --images || true
          python agentic-python/ingest_tangoverse.py --publish || true
          python agentic-python/ingest_tmd.py || true
          python agentic-python/ingest_instagram.py || true
          python agentic-python/publish_instagram.py || true
          python agentic-python/collect_images.py --limit 60 || true

      - name: Persist collected images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/assets/events src/content/news
          if ! git diff --cached --quiet; then
            git commit -m "chore: backfill event images [skip ci]"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name tango-news --commit-dirty=true
