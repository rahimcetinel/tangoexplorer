name: Update site

# İçerik toplama hattı: kaynaklardan veri çeker, görselleri toplar, build eder,
# deploy eder ve (schedule'da) canlı siteyi görsel + E2E ile doğrular.
# Kod değişikliğini hızlıca yayına almak için bunu değil "Deploy" hattını
# kullanın; push zaten Deploy'u tetikler.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      checks:
        description: "Deploy sonrası görsel kontrol + E2E testlerini çalıştır"
        type: boolean
        default: false

permissions:
  contents: write

# deploy.yml ile aynı grup: sıraya girer, üst üste binmez.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # Astro >=7.4 requires Node >=22.23.4, and the "22" alias can resolve to
          # an older runner patch; use the LTS major we also build with locally.
          node-version: "24"
          cache: npm

      - uses: actions/cache@v4
        with:
          path: agentic-python/out
          key: ingest-out-${{ github.run_id }}
          restore-keys: |
            ingest-out-

      - run: npm ci

      # Astro'nun optimize görsel cache'i (node_modules/.astro) `npm ci` ile
      # siliniyor; geri yüklemek build süresini ~10 dk'dan birkaç dakikaya indirir.
      - name: Restore Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-images-${{ runner.os }}-

      - name: Ingest and publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          python agentic-python/ingest.py || true
          python agentic-python/publish.py || true
          python agentic-python/ingest_hoy.py || true
          python agentic-python/ingest_tango_de.py --publish || true
          python agentic-python/ingest_sweden.py --publish || true
          python agentic-python/ingest_milongas_ch.py --publish || true
          python agentic-python/ingest_oslo.py --publish || true
          python agentic-python/ingest_vienna.py --publish || true
          python agentic-python/ingest_italy.py --publish || true
          python agentic-python/ingest_spain.py --publish || true
          python agentic-python/ingest_london.py --publish || true
          python agentic-python/ingest_netherlands.py --publish || true
          python agentic-python/ingest_france.py --publish || true
          python agentic-python/ingest_czechia.py --publish || true
          python agentic-python/ingest_poland.py --publish || true
          python agentic-python/ingest_romania.py --publish || true
          python agentic-python/enrich_event_websites.py --apply || true
          python agentic-python/ingest_tangoverse.py --images || true
          python agentic-python/ingest_tangoverse.py --publish || true
          python agentic-python/ingest_tmd.py || true
          python agentic-python/ingest_instagram.py || true
          python agentic-python/publish_instagram.py || true
          python agentic-python/collect_images.py --limit 60 || true
          # PNG olarak inen kapakları JPEG'e çevirir (build/deploy boyutu ve
          # `<Picture>` fallback'i için); frontmatter referanslarını da günceller.
          node agentic-python/normalize-event-images.mjs || true

      - name: Audit data quality
        if: always()
        run: python agentic-python/audit_data.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload data audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-audit
          path: agentic-python/out/data-audit.json
          if-no-files-found: warn

      - name: Check outbound links
        if: always()
        run: python agentic-python/check_links.py --timeout 12 --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check
          path: agentic-python/out/link-check.json
          if-no-files-found: warn

      - name: Persist link health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/link-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update link health [skip ci]"
            git push
          fi

      - name: Drop the removed Turkish locale
        run: rm -rf src/content/news/tr

      - name: Persist collected images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/assets/events src/content/news
          if ! git diff --cached --quiet; then
            git commit -m "chore: backfill event images [skip ci]"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name tango-news --commit-dirty=true

      # Deploy sonrası canlı site kontrolü. Schedule'da her zaman, manuel
      # tetiklemede yalnızca `checks` işaretliyse çalışır (hızlı deploy ~3 dk kazanır).
      - name: Install Chromium for the visual check
        if: github.event_name == 'schedule' || inputs.checks
        run: npx playwright install --with-deps chromium

      - name: Visual check (live site)
        if: github.event_name == 'schedule' || inputs.checks
        run: |
          sleep 10
          npm run check:visual

      # Behaviour suite against the freshly deployed site. Runs even when the
      # visual check fails so both signals are available in one run.
      - name: E2E tests (live site)
        if: always() && (github.event_name == 'schedule' || inputs.checks)
        run: npm run test:e2e

      - name: Upload visual check screenshots
        if: always() && (github.event_name == 'schedule' || inputs.checks)
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: agentic-python/out/visual
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always() && (github.event_name == 'schedule' || inputs.checks)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

      # Ingest adımları `|| true` ile koşuyor; bozuk bir kaynak (ölü ICS, değişen
      # HTML, süresi geçmiş IG token'ı) sessizce eski veriyi bırakır. Bu adım
      # sonucu kontrol eder ve gerçek bir sorunda koşuyu kırmızıya çevirir.
      - name: Source health
        if: always()
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python agentic-python/source_health.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health
          path: agentic-python/out/source-health.json
          if-no-files-found: warn
